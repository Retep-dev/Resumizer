name: Backend tests

on:
  push:
    branches: [main, "design/**"]
    paths: ["backend/**", "!backend/eval/request.json", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and API tests (mocked AI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt matplotlib
      - run: python -m pytest -q -rs

  live:
    name: Live NVIDIA check (needs NVIDIA_API_KEY secret)
    runs-on: ubuntu-latest
    needs: unit
    env:
      # Live checks send only the fictional test resumes, so they run in evaluation mode.
      AI_DEPLOYMENT: evaluation
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Which models can this key use?
        if: env.NVIDIA_API_KEY != ''
        run: python scripts/check_models.py nvidia/nemotron-3.5-lightning-30b-a3b openai/gpt-oss-20b
        continue-on-error: true
      - name: Live accuracy tests
        if: env.NVIDIA_API_KEY != ''
        run: RESUMIZER_LIVE=1 python -m pytest tests/test_live_nvidia.py -k accurate -q -s -rs
      - name: Live coach conversation
        if: always() && env.NVIDIA_API_KEY != ''
        run: RESUMIZER_LIVE=1 python -m pytest tests/test_live_nvidia.py -k coach -q -s -rs
      - name: Live rewrite comparison by model
        if: always() && env.NVIDIA_API_KEY != ''
        run: RESUMIZER_LIVE=1 python -m pytest tests/test_live_nvidia.py -k rewrite_quality -q -s -rs
      - name: Skipped
        if: env.NVIDIA_API_KEY == ''
        run: echo "Add NVIDIA_API_KEY as a repository secret to run live checks."
